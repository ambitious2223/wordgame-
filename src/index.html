<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي الرسم | TikTok Drawing Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Noto Sans Arabic', sans-serif;
            background: #0a0a1a;
            color: #fff;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 20px;
            min-height: 100vh;
        }

        /* Header */
        .header {
            grid-column: 1 / -1;
            background: #1a1a2e;
            border: 2px solid #00d4ff;
            border-radius: 12px;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
        }

        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            color: #00d4ff;
        }

        .round-info {
            font-size: 1.1rem;
            color: #ffcc00;
        }

        /* Main Area */
        .main {
            background: #1a1a2e;
            border: 2px solid #00d4ff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Timer */
        .timer-section {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }

        .timer-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: conic-gradient(#00ff88 0%, #00ff88 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .timer-circle::before {
            content: '';
            width: 80px;
            height: 80px;
            background: #1a1a2e;
            border-radius: 50%;
            position: absolute;
        }

        .timer-value {
            position: relative;
            z-index: 1;
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            color: #fff;
        }

        /* Word Card (Hidden) */
        .word-card {
            background: #252542;
            border: 3px solid #9d00ff;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .word-card.hidden .card-content {
            filter: blur(10px);
            user-select: none;
        }

        .word-card.hidden::after {
            content: '🔒 بطاقة مخفية';
            position: absolute;
            font-size: 1.5rem;
            color: #ffcc00;
        }

        .card-label {
            font-size: 0.9rem;
            color: #a0a0a0;
            margin-bottom: 10px;
        }

        .card-content {
            font-size: 3rem;
            font-weight: bold;
            color: #ff0080;
            text-shadow: 0 0 20px #ff0080;
        }

        .card-meaning {
            font-size: 1.2rem;
            color: #00d4ff;
            margin-top: 10px;
        }

        /* Drawing Canvas */
        .canvas-container {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        #drawCanvas {
            width: 100%;
            height: 400px;
            cursor: crosshair;
            display: block;
        }

        .canvas-tools {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            background: rgba(0,0,0,0.7);
            padding: 10px 15px;
            border-radius: 8px;
        }

        .tool-btn {
            width: 35px;
            height: 35px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.2s;
        }

        .tool-btn:hover {
            transform: scale(1.1);
        }

        .tool-btn.active {
            outline: 3px solid #ffcc00;
        }

        .color-black { background: #000; }
        .color-red { background: #ff0000; }
        .color-blue { background: #0000ff; }
        .color-green { background: #00ff00; }
        .color-yellow { background: #ffff00; }
        .color-white { background: #fff; border: 2px solid #ccc; }
        .btn-clear { background: #ff3366; color: #fff; width: auto !important; padding: 0 15px; border-radius: 5px; }

        /* Guess Input */
        .guess-section {
            display: flex;
            gap: 10px;
        }

        .guess-input {
            flex: 1;
            background: #252542;
            border: 2px solid #00d4ff;
            border-radius: 8px;
            padding: 15px;
            font-size: 1.2rem;
            color: #fff;
            font-family: 'Noto Sans Arabic', sans-serif;
            direction: rtl;
        }

        .guess-input:focus {
            outline: none;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.5);
        }

        .guess-btn {
            background: linear-gradient(135deg, #00d4ff, #9d00ff);
            border: none;
            border-radius: 8px;
            padding: 15px 30px;
            color: #fff;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Noto Sans Arabic', sans-serif;
        }

        .guess-btn:hover {
            transform: scale(1.05);
        }

        /* Guesses List */
        .guesses-list {
            background: #252542;
            border-radius: 8px;
            padding: 15px;
            max-height: 150px;
            overflow-y: auto;
        }

        .guesses-list h4 {
            color: #a0a0a0;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .guess-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            margin-bottom: 5px;
            border-radius: 5px;
            background: rgba(255,255,255,0.05);
        }

        .guess-item.correct {
            background: rgba(0, 255, 136, 0.2);
            border: 1px solid #00ff88;
        }

        .guess-item.wrong {
            background: rgba(255, 51, 102, 0.2);
            border: 1px solid #ff3366;
        }

        .guess-player { color: #ffcc00; }
        .guess-word { color: #fff; }
        .guess-status { font-size: 1.2rem; }

        /* Sidebar - Leaderboard */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .leaderboard {
            background: #1a1a2e;
            border: 2px solid #ffcc00;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.2);
        }

        .leaderboard h3 {
            text-align: center;
            color: #ffcc00;
            margin-bottom: 15px;
        }

        .leader-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            margin-bottom: 8px;
            background: #252542;
            border-radius: 6px;
        }

        .leader-item:nth-child(2) { border: 1px solid #ffcc00; }
        .leader-item:nth-child(3) { border: 1px solid #c0c0c0; }
        .leader-item:nth-child(4) { border: 1px solid #cd7f32; }

        .leader-rank { color: #ffcc00; font-weight: bold; }
        .leader-name { flex: 1; margin: 0 10px; }
        .leader-score { color: #00ff88; font-family: 'Orbitron', sans-serif; }

        /* Controls */
        .controls {
            background: #1a1a2e;
            border: 2px solid #9d00ff;
            border-radius: 12px;
            padding: 20px;
        }

        .controls h3 {
            text-align: center;
            color: #9d00ff;
            margin-bottom: 15px;
        }

        .ctrl-btn {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Noto Sans Arabic', sans-serif;
            transition: transform 0.2s;
        }

        .ctrl-btn:hover { transform: scale(1.02); }

        .btn-start { background: #00ff88; color: #0a0a1a; }
        .btn-next { background: #00d4ff; color: #0a0a1a; }
        .btn-reveal { background: #ffcc00; color: #0a0a1a; }
        .btn-end { background: #ff3366; color: #fff; }

        .ctrl-settings {
            margin-top: 15px;
        }

        .ctrl-settings label {
            display: block;
            color: #a0a0a0;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .ctrl-settings input {
            width: 100%;
            padding: 8px;
            background: #252542;
            border: 1px solid #00d4ff;
            border-radius: 5px;
            color: #fff;
            margin-bottom: 10px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 26, 0.95);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.show { display: flex; }

        .modal-box {
            background: #1a1a2e;
            border: 3px solid #ffcc00;
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            max-width: 400px;
        }

        .modal-box h2 {
            font-size: 2rem;
            color: #ffcc00;
            margin-bottom: 20px;
        }

        .modal-box .winner {
            font-size: 3rem;
            margin: 20px 0;
        }

        .modal-box .winner-name {
            font-size: 1.5rem;
            color: #00d4ff;
        }

        .modal-box .winner-score {
            color: #00ff88;
            font-size: 1.2rem;
        }

        .modal-btn {
            background: linear-gradient(135deg, #00d4ff, #9d00ff);
            border: none;
            border-radius: 8px;
            padding: 15px 40px;
            color: #fff;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 20px;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🎯 تحدي الرسم</h1>
            <span class="round-info">الجولة <span id="roundNum">0</span>/<span id="totalRounds">10</span></span>
        </div>

        <!-- Main Area -->
        <div class="main">
            <!-- Timer -->
            <div class="timer-section">
                <div class="timer-circle" id="timerCircle">
                    <span class="timer-value" id="timerValue">--</span>
                </div>
            </div>

            <!-- Word Card (Streamer View) -->
            <div class="word-card hidden" id="wordCard">
                <div class="card-label">الكلمة المطلوب رسمها</div>
                <div class="card-content" id="cardWord">--</div>
                <div class="card-meaning" id="cardMeaning">--</div>
            </div>

            <!-- Drawing Canvas -->
            <div class="canvas-container">
                <canvas id="drawCanvas"></canvas>
                <div class="canvas-tools">
                    <button class="tool-btn color-black active" data-color="#000"></button>
                    <button class="tool-btn color-red" data-color="#ff0000"></button>
                    <button class="tool-btn color-blue" data-color="#0000ff"></button>
                    <button class="tool-btn color-green" data-color="#00aa00"></button>
                    <button class="tool-btn color-yellow" data-color="#ffcc00"></button>
                    <button class="tool-btn color-white" data-color="#fff"></button>
                    <button class="tool-btn btn-clear" id="clearBtn">🗑️</button>
                </div>
            </div>

            <!-- Guess Input -->
            <div class="guess-section">
                <input type="text" class="guess-input" id="guessInput" placeholder="خمن الكلمة هنا..." autocomplete="off">
                <button class="guess-btn" id="guessBtn">خمن!</button>
            </div>

            <!-- Recent Guesses -->
            <div class="guesses-list" id="guessesList">
                <h4>التخمينات الأخيرة</h4>
            </div>
        </div>

        <!-- Sidebar -->
        <div class="sidebar">
            <!-- Leaderboard -->
            <div class="leaderboard">
                <h3>🏆 الصدارة</h3>
                <div id="leaderboard">
                    <div class="leader-item"><span class="leader-rank">1</span><span class="leader-name">@ahmad</span><span class="leader-score">150</span></div>
                    <div class="leader-item"><span class="leader-rank">2</span><span class="leader-name">@sara</span><span class="leader-score">120</span></div>
                    <div class="leader-item"><span class="leader-rank">3</span><span class="leader-name">@omar</span><span class="leader-score">95</span></div>
                    <div class="leader-item"><span class="leader-rank">4</span><span class="leader-name">@fati</span><span class="leader-score">80</span></div>
                    <div class="leader-item"><span class="leader-rank">5</span><span class="leader-name">@khalid</span><span class="leader-score">65</span></div>
                </div>
            </div>

            <!-- Controls -->
            <div class="controls">
                <h3>🎮 التحكم</h3>
                <button class="ctrl-btn btn-start" id="startBtn">▶️ بدء اللعبة</button>
                <button class="ctrl-btn btn-next" id="nextBtn">⏭️ الكلمة التالية</button>
                <button class="ctrl-btn btn-reveal" id="revealBtn">👁️ إظهار البطاقة</button>
                <button class="ctrl-btn btn-end" id="endBtn">⏹️ إنهاء</button>
                <div class="ctrl-settings">
                    <label>عدد الجولات:</label>
                    <input type="number" id="roundsInput" value="10" min="1" max="50">
                    <label>مدة التخمين (ثانية):</label>
                    <input type="number" id="durationInput" value="30" min="10" max="120">
                </div>
            </div>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div class="modal" id="gameModal">
        <div class="modal-box">
            <h2>🏆 انتهت اللعبة!</h2>
            <div class="winner">👑</div>
            <div class="winner-name" id="winnerName">@ahmad</div>
            <div class="winner-score" id="winnerScore">150 نقطة</div>
            <button class="modal-btn" id="playAgainBtn">العب مرة أخرى</button>
        </div>
    </div>

    <script>
        // Word cards for drawing
        const WORD_CARDS = [
            { word: 'قطة', meaning: 'Cat' },
            { word: 'كلب', meaning: 'Dog' },
            { word: 'بيت', meaning: 'House' },
            { word: 'شمس', meaning: 'Sun' },
            { word: 'قمر', meaning: 'Moon' },
            { word: 'شجرة', meaning: 'Tree' },
            { word: 'بحر', meaning: 'Sea' },
            { word: 'سيارة', meaning: 'Car' },
            { word: 'طائرة', meaning: 'Airplane' },
            { word: 'تفاح', meaning: 'Apple' },
            { word: 'موزة', meaning: 'Banana' },
            { word: 'زهرة', meaning: 'Flower' },
            { word: 'نجمة', meaning: 'Star' },
            { word: 'قلب', meaning: 'Heart' },
            { word: 'كتاب', meaning: 'Book' },
            { word: 'هاتف', meaning: 'Phone' },
            { word: 'حقيبة', meaning: 'Bag' },
            { word: 'نظارة', meaning: 'Glasses' },
            { word: 'مفتاح', meaning: 'Key' },
            { word: 'ساعة', meaning: 'Clock' }
        ];

        // Game state
        let state = {
            isRunning: false,
            currentRound: 0,
            totalRounds: 10,
            duration: 30,
            timeLeft: 0,
            currentCard: null,
            cardHidden: true,
            guesses: [],
            players: {
                'ahmad': { name: 'ahmad', score: 0 },
                'sara': { name: 'sara', score: 0 },
                'omar': { name: 'omar', score: 0 },
                'fati': { name: 'fati', score: 0 },
                'khalid': { name: 'khalid', score: 0 }
            }
        };

        let timer = null;
        let usedCards = [];

        // Canvas setup
        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');
        let drawing = false;
        let currentColor = '#000';

        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = 400;
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // Drawing events
        canvas.addEventListener('mousedown', (e) => {
            drawing = true;
            ctx.beginPath();
            ctx.moveTo(e.offsetX, e.offsetY);
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!drawing) return;
            ctx.lineTo(e.offsetX, e.offsetY);
            ctx.strokeStyle = currentColor;
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.stroke();
        });

        canvas.addEventListener('mouseup', () => drawing = false);
        canvas.addEventListener('mouseleave', () => drawing = false);

        // Color buttons
        document.querySelectorAll('.tool-btn[data-color]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentColor = btn.dataset.color;
            });
        });

        // Clear canvas
        document.getElementById('clearBtn').addEventListener('click', () => {
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        });

        // Timer
        function updateTimer() {
            document.getElementById('timerValue').textContent = state.timeLeft;
            const circle = document.getElementById('timerCircle');
            const percent = (state.timeLeft / state.duration) * 100;
            
            if (state.timeLeft <= 5) {
                circle.style.background = `conic-gradient(#ff3366 0%, #ff3366 ${percent}%, #252542 ${percent}%)`;
            } else if (state.timeLeft <= 10) {
                circle.style.background = `conic-gradient(#ffcc00 0%, #ffcc00 ${percent}%, #252542 ${percent}%)`;
            } else {
                circle.style.background = `conic-gradient(#00ff88 0%, #00ff88 ${percent}%, #252542 ${percent}%)`;
            }
        }

        function startTimer() {
            stopTimer();
            state.timeLeft = state.duration;
            updateTimer();
            
            timer = setInterval(() => {
                state.timeLeft--;
                updateTimer();
                
                if (state.timeLeft <= 0) {
                    endRound();
                }
            }, 1000);
        }

        function stopTimer() {
            if (timer) {
                clearInterval(timer);
                timer = null;
            }
        }

        // Get random card
        function getRandomCard() {
            if (usedCards.length >= WORD_CARDS.length) {
                usedCards = [];
            }
            
            let card;
            do {
                card = WORD_CARDS[Math.floor(Math.random() * WORD_CARDS.length)];
            } while (usedCards.includes(card.word));
            
            usedCards.push(card.word);
            return card;
        }

        // Game functions
        function startGame() {
            state.totalRounds = parseInt(document.getElementById('roundsInput').value) || 10;
            state.duration = parseInt(document.getElementById('durationInput').value) || 30;
            state.currentRound = 0;
            state.guesses = [];
            
            // Reset scores
            Object.values(state.players).forEach(p => p.score = 0);
            updateLeaderboard();
            
            state.isRunning = true;
            nextRound();
        }

        function nextRound() {
            if (state.currentRound >= state.totalRounds) {
                endGame();
                return;
            }
            
            state.currentRound++;
            state.cardHidden = true;
            state.guesses = [];
            
            // Get new card
            state.currentCard = getRandomCard();
            
            // Update UI
            document.getElementById('roundNum').textContent = state.currentRound;
            document.getElementById('totalRounds').textContent = state.totalRounds;
            document.getElementById('cardWord').textContent = state.currentCard.word;
            document.getElementById('cardMeaning').textContent = state.currentCard.meaning;
            
            // Hide card
            document.getElementById('wordCard').classList.add('hidden');
            
            // Clear guesses
            document.getElementById('guessesList').innerHTML = '<h4>التخمينات الأخيرة</h4>';
            
            // Clear canvas
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Start timer
            startTimer();
        }

        function revealCard() {
            state.cardHidden = false;
            document.getElementById('wordCard').classList.remove('hidden');
        }

        function endRound() {
            stopTimer();
            revealCard();
            
            // Auto move to next round after 3 seconds
            setTimeout(() => {
                if (state.isRunning) {
                    nextRound();
                }
            }, 3000);
        }

        function endGame() {
            stopTimer();
            state.isRunning = false;
            
            // Find winner
            const sorted = Object.values(state.players).sort((a, b) => b.score - a.score);
            const winner = sorted[0];
            
            document.getElementById('winnerName').textContent = '@' + winner.name;
            document.getElementById('winnerScore').textContent = winner.score + ' نقطة';
            document.getElementById('gameModal').classList.add('show');
        }

        // Guess handling
        function makeGuess() {
            const input = document.getElementById('guessInput');
            const guess = input.value.trim();
            input.value = '';
            
            if (!guess || !state.isRunning) return;
            
            const isCorrect = guess === state.currentCard.word;
            const player = 'ahmad'; // Default player for demo
            
            // Add to guesses list
            state.guesses.push({ player, word: guess, correct: isCorrect });
            
            // Update score if correct
            if (isCorrect) {
                state.players[player].score += 10 + Math.floor(state.timeLeft / 2);
                updateLeaderboard();
            }
            
            // Update guesses UI
            updateGuessesList();
        }

        function updateGuessesList() {
            const list = document.getElementById('guessesList');
            list.innerHTML = '<h4>التخمينات الأخيرة</h4>';
            
            state.guesses.slice(-5).reverse().forEach(g => {
                const item = document.createElement('div');
                item.className = 'guess-item ' + (g.correct ? 'correct' : 'wrong');
                item.innerHTML = `
                    <span class="guess-player">@${g.player}</span>
                    <span class="guess-word">${g.word}</span>
                    <span class="guess-status">${g.correct ? '✅' : '❌'}</span>
                `;
                list.appendChild(item);
            });
        }

        function updateLeaderboard() {
            const sorted = Object.values(state.players).sort((a, b) => b.score - a.score);
            const container = document.getElementById('leaderboard');
            container.innerHTML = '';
            
            sorted.forEach((p, i) => {
                const item = document.createElement('div');
                item.className = 'leader-item';
                item.innerHTML = `
                    <span class="leader-rank">${i + 1}</span>
                    <span class="leader-name">@${p.name}</span>
                    <span class="leader-score">${p.score}</span>
                `;
                container.appendChild(item);
            });
        }

        // Event listeners
        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('nextBtn').addEventListener('click', nextRound);
        document.getElementById('revealBtn').addEventListener('click', revealCard);
        document.getElementById('endBtn').addEventListener('click', endGame);
        document.getElementById('guessBtn').addEventListener('click', makeGuess);
        document.getElementById('playAgainBtn').addEventListener('click', () => {
            document.getElementById('gameModal').classList.remove('show');
            startGame();
        });

        document.getElementById('guessInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') makeGuess();
        });

        // Init
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        
        console.log('🎮 Game loaded! Click "بدء اللعبة" to start');
    </script>
</body>
</html>
