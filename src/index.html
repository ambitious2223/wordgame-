<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="لعبة تخمين الكلمات العربية من الحروف المبعثرة على بث TikTok المباشر">
    <title>تحدي الكلمات | Word Challenge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="layout">
        <!-- Header -->
        <header class="header">
            <h1>🎯 <span data-i18n="app.title">تحدي الكلمات</span></h1>
            <span class="round-badge"><span data-i18n="badge.round">الجولة</span> <span id="roundNum">0</span>/<span id="totalRounds">10</span></span>
        </header>

        <!-- Left column: live leaderboard + match standings -->
        <aside class="col col--left">
            <section class="panel panel--live" aria-live="polite">
                <div class="panel-title purple" data-i18n="leaderboard.live">المتصدرون مباشرة</div>
                <div class="panel-body" id="liveLeaderboard"></div>
            </section>

            <section class="panel panel--match">
                <div class="panel-title gold" data-i18n="leaderboard.match">نتائج المباراة</div>
                <div class="panel-body" id="matchStandings"></div>
            </section>
        </aside>

        <!-- Center: the arena stretches to fill the screen -->
        <main class="main">
            <div class="timer-row">
                <div class="timer-circle" id="timerCircle" role="timer" aria-live="polite">
                    <div class="timer-inner">
                        <span class="timer-num" id="timerNum">--</span>
                    </div>
                </div>
            </div>

            <section class="letters-section">
                <div class="letters-label" data-i18n="letters.available">الحروف المتاحة</div>
                <div class="letters-row" id="lettersRow" role="group" aria-label="الحروف المتاحة"></div>
                <div class="possible-count" id="possibleCount"></div>
            </section>

            <div class="score-section">
                <div class="score-box">
                    <div class="label" data-i18n="score.total">النقاط</div>
                    <div class="value" id="scoreValue">0</div>
                </div>
                <div class="score-box combo">
                    <div class="label" data-i18n="score.multiplier">المضاعف</div>
                    <div class="value" id="multiplierValue">×1</div>
                </div>
                <div class="score-box">
                    <div class="label" data-i18n="score.round">هذه الجولة</div>
                    <div class="value" id="roundScore">0</div>
                </div>
            </div>

            <div class="word-area" id="wordArea" title="انقر لمسح الكلمة">
                <span class="word-display" id="wordDisplay"></span>
                <span class="word-placeholder" id="wordPlaceholder" data-i18n="word.placeholder">اكتب كلمة أو انقر على الحروف</span>
            </div>

            <div class="input-row">
                <input type="text" class="guess-input" id="guessInput" placeholder="اكتب الكلمة هنا..." autocomplete="off" aria-label="اكتب تخمينك" data-i18n-placeholder="guess.placeholder" data-i18n-aria="guess.aria">
                <button class="submit-btn" id="submitBtn" type="button" data-i18n="submit">تأكيد ✓</button>
            </div>

            <section class="found-section" aria-live="polite">
                <div class="found-title" data-i18n="found.title">الكلمات المكتشفة في هذه الجولة</div>
                <div class="found-list" id="foundList"></div>
            </section>
        </main>

        <!-- Right column: all-time winners -->
        <aside class="col col--right">
            <section class="panel panel--champions">
                <div class="panel-title gold" data-i18n="leaderboard.allTime">🏆 أبطال كل الأوقات</div>
                <div class="panel-body" id="champions"></div>
            </section>
        </aside>
    </div>

    <!-- Floating, draggable, collapsible host controls -->
    <div class="host-dock" id="hostDock">
        <button class="host-dock__toggle" id="hostToggle" type="button" aria-expanded="true" aria-controls="hostPanel" title="لوحة التحكم" data-i18n-aria="controls.toggle">🎮</button>
        <div class="host-dock__panel" id="hostPanel">
            <div class="host-dock__handle" id="hostHandle" aria-hidden="true">⠿ تحكم</div>
            <button class="ctrl-btn btn-start" id="startBtn" type="button" data-i18n="controls.start">▶️ بدء اللعبة</button>
            <button class="ctrl-btn btn-next" id="nextBtn" type="button" data-i18n="controls.next">⏭️ الجولة التالية</button>
            <button class="ctrl-btn btn-end" id="endBtn" type="button" data-i18n="controls.end">⏹️ إنهاء</button>
            <div class="ctrl-settings">
                <label for="roundsInput" data-i18n="settings.rounds">عدد الجولات:</label>
                <input type="number" id="roundsInput" value="10" min="1" max="50">
                <label for="durationInput" data-i18n="settings.duration">ثانية لكل جولة:</label>
                <input type="number" id="durationInput" value="15" min="5" max="60">
            </div>
            <div class="ctrl-media">
                <button class="ctrl-btn btn-media" id="musicToggle" type="button">🔊 الموسيقى</button>
                <label for="musicVolume" data-i18n="controls.volume">مستوى الصوت</label>
                <input type="range" id="musicVolume" min="0" max="100" value="30" aria-label="مستوى الصوت">
            </div>
            <button class="ctrl-btn btn-champions" id="showChampionsBtn" type="button" data-i18n="controls.champions">🏆 عرض الأبطال</button>
            <div class="ctrl-hub">
                <div class="hub-status" id="hubStatus" data-i18n="hub.offline">غير متصل (وضع تجريبي)</div>
                <label for="hubSlug" data-i18n="hub.slug">معرّف اللعبة</label>
                <input type="text" id="hubSlug" autocomplete="off" value="word-challenge">
                <label for="hubKey" data-i18n="hub.key">مفتاح المركز</label>
                <input type="text" id="hubKey" autocomplete="off" placeholder="gk_...">
            </div>
        </div>
    </div>

    <!-- Round Results -->
    <div class="modal" id="resultsModal" role="dialog" aria-modal="true" aria-labelledby="resultsTitle">
        <div class="modal-box results-box">
            <h2 id="resultsTitle">انتهت الجولة</h2>
            <p id="resultsSummary"></p>
            <div class="results-words" id="resultsWords"></div>
            <button class="modal-btn" id="resultsContinue" type="button">الجولة التالية</button>
            <div class="results-countdown" id="resultsAuto"></div>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div class="modal" id="gameModal" role="dialog" aria-modal="true" aria-labelledby="gameOverTitle">
        <div class="modal-box">
            <h2 id="gameOverTitle">🏆 <span data-i18n="gameOver.title">انتهت اللعبة!</span></h2>
            <div class="modal-winner">👑</div>
            <div class="modal-name" id="winnerName">@أنت</div>
            <div class="modal-score" id="winnerScore">0 نقطة</div>
            <button class="modal-btn" id="playAgainBtn" type="button" data-i18n="playAgain">العب مرة أخرى</button>
        </div>
    </div>

    <!-- Feedback layers -->
    <div id="toastContainer" aria-live="polite" aria-atomic="true"></div>
    <div id="scorePopupLayer" aria-hidden="true"></div>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
